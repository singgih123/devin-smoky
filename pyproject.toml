[tool.poetry]
name = "devin-smoky"
version = "0.1.0"
description = "Telegram bot bridge for chatting with Devin"
authors = ["SINGGIH <singgihimam.m@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.12"
httpx = "^0.28.1"
pydantic-settings = "^2.9.1"
uvicorn = { extras = ["standard"], version = "^0.34.2" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
ruff = "^0.11.10"

[tool.ruff]
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
